<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>MyStream</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Menú lateral (TV y pantallas anchas) -->
  <aside id="riel">
    <div class="marca">My<b>Stream</b></div>
    <button class="nav-btn foco" data-pestana="inicio" aria-label="Inicio">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span>
    </button>
    <button class="nav-btn foco" data-pestana="buscar" aria-label="Buscar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Buscar</span>
    </button>
    <button class="nav-btn foco" data-pestana="anime" aria-label="Anime">
      <svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 6.5 3 11c0 2.4 1.3 4.5 3.3 5.9L5.5 21l4-2.2c.8.1 1.6.2 2.5.2 5 0 9-3.5 9-8s-4-8-9-8z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/></svg><span>Anime</span>
    </button>
    <button class="nav-btn foco" data-pestana="deportes" aria-label="Deportes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.6h-5L8 10.4z"/></svg><span>Deportes</span>
    </button>
    <button class="nav-btn foco" data-pestana="tv" aria-label="TV en vivo">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M9 2l3 4 3-4"/></svg><span>TV en vivo</span>
    </button>
    <button class="nav-btn foco" data-pestana="ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Ajustes</span>
    </button>
  </aside>

  <main id="vista"></main>

  <!-- Barra inferior (teléfono) -->
  <nav id="barra">
    <button class="nav-btn" data-pestana="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
    <button class="nav-btn" data-pestana="buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Buscar</span></button>
    <button class="nav-btn" data-pestana="anime"><svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 6.5 3 11c0 2.4 1.3 4.5 3.3 5.9L5.5 21l4-2.2c.8.1 1.6.2 2.5.2 5 0 9-3.5 9-8s-4-8-9-8z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/></svg><span>Anime</span></button>
    <button class="nav-btn" data-pestana="deportes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.6h-5L8 10.4z"/></svg><span>Deportes</span></button>
    <button class="nav-btn" data-pestana="tv"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M9 2l3 4 3-4"/></svg><span>TV</span></button>
    <button class="nav-btn" data-pestana="ajustes"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Ajustes</span></button>
  </nav>

  <!-- Ventana emergente -->
  <div id="modal" class="oculto"></div>

  <!-- Visor de páginas web (para fuentes que no son video directo) -->
  <div id="marco" class="oculto">
    <div class="marco-barra">
      <button id="marco-cerrar" class="btn sec foco">✕ Cerrar</button>
      <span id="marco-titulo"></span>
    </div>
    <iframe id="marco-iframe" title="Reproductor"
      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <div id="aviso" role="status" aria-live="polite"></div>

  <script src="config-predeterminada.js"></script>
  <script src="nucleo.js"></script>
  <script src="navegacion-tv.js"></script>
  <script src="app.js"></script>
</body>
</html>
